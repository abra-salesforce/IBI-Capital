<template>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_small slds-truncate" title={task.Subject}>
                    {task.Subject}
                </h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <div class="slds-grid slds-gutters slds-m-top_x-small">
                    <div class="slds-col">
                        <div class="slds-grid slds-grid_vertical-align-center slds-text-title slds-m-bottom_xx-small">
                            <lightning-icon icon-name="utility:user" alternative-text="User" size="xx-small"></lightning-icon>
                            <span class="slds-m-left_x-small">Assigned To</span>
                        </div>
                        <div class="slds-text-body_small">
                            <span>{task.AssignedTo}</span>
                        </div>
                    </div>

                    <div class="slds-col">
                        <div class="slds-grid slds-grid_vertical-align-center slds-text-title slds-m-bottom_xx-small">
                            <lightning-icon icon-name="utility:event" alternative-text="Start Date" size="xx-small"></lightning-icon>
                            <span class="slds-m-left_x-small">Due Date</span>
                        </div>
                        <div class="slds-text-body_small">
                            <span>{task.Date}</span>
                        </div>
                    </div>
                </div>

                <div>
                    <lightning-textarea
                        label="Description"
                        value={task.Description}
                        class="slds-m-top_medium">
                    </lightning-textarea>
                </div>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button
                    class="slds-m-right_small"
                    variant="neutral"
                    label="Close"
                    onclick={handleClose}>
                </lightning-button>
                <lightning-button
                    variant="brand"
                    label="Save"
                    onclick={handleSave}>
                </lightning-button>
            </footer>
        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
    
</template>
