<template>
    <div class="actionPlanHeader">
        <lightning-icon icon-name="standard:work_plan_template_entry" alternative-text="action plan" size="medium"></lightning-icon>
        <h1>Action Plans ({numberOfPlans})</h1>
    </div>
    <div class="plansContainer">
        <div class="outerAccordion">
            <template for:each={plans} for:item="plan">
                <div key={plan.Id} class="accSection">
                    <div class="accHeader"
                        data-id={plan.Id}
                        data-open={plan.isOpen}>
                        
                        <div class="planTitle">
                            <span class="planName">{plan.Name}</span>
                            <div class="planStatus">
                                {plan.Status__c}
                            </div>
                        </div>
                            

                        <div class="planDetails">
                            <div class="field">
                                <lightning-icon icon-name="utility:slack_user" alternative-text="User" size="x-small"></lightning-icon>
                                <div class="label">{plan.Owner}</div>
                            </div>

                            <div class="field">
                                <lightning-icon icon-name="utility:event" alternative-text="Start Date" size="x-small"></lightning-icon>
                                <div class="label">{plan.Start_Date__c}</div>
                            </div>
                        </div>

                        <!--<lightning-input
                            type="checkbox"
                            label="Completed"
                            checked={plan.Completed}
                            disabled>
                        </lightning-input>-->
                    </div>

                    <div class="divider"></div>

                    <div class="planContainer">
                        <div class="taskToggle"
                            data-id={plan.Id}
                            data-open={plan.tasksOpen}
                            onclick={handleToggleTasks}>
                            <lightning-icon
                                icon-name="utility:chevronright"
                                size="xx-small"
                                class="chevronIcon"
                                alternative-text="Toggle Tasks">
                            </lightning-icon>
                            <span class="taskLabel">{plan.TaskListLabel}</span>
                        </div>

                        <template if:true={plan.tasksOpen}>
                            <div class="taskBody">
                                <c-action-plan-task-table plan={plan}></c-action-plan-task-table>
                            </div>
                        </template>
                    </div>



                </div>
            </template>
        </div>
    </div>
</template>
