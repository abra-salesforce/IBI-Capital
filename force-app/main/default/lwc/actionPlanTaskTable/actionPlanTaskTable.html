<template>
    <template lwc:if={loading}>
        <div class="slds-align_absolute-center slds-p-around_medium">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-scrollable_x">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate" title="Name">Name</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Date">Date</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Assigned to">Assigned to</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Assigned to">Status</div>
                        </th>
                        <th scope="col">
                            <div class="slds-hide" title="Completed">Completed</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={tasks} for:item="t">
                        <tr key={t.Id}
                            data-id={t.Id}
                            class={t.rowClass}
                            onclick={handleSelectedRow}>
                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.Subject}>
                                    {t.Subject}
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.Date}>
                                    {t.Date}
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.AssignedTo}>
                                    {t.AssignedTo}
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.Status}>
                                    {t.Status}
                                </div>
                            </td>
                            <td>
                                <lightning-input
                                    type="checkbox"
                                    data-id={t.Id}
                                    checked={t.Completed}
                                    onclick={handleCheckCompleted}
                                    label={t.checkboxLabel}>
                                </lightning-input>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <template lwc:if={openModal}>
            <c-task-details-modal
                task={selectedTask}
                onclose={handleCloseModal}>
            </c-task-details-modal>
        </template>

    </template>
    
</template>
