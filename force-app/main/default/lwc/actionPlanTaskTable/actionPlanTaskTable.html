<template>
    <template lwc:if={loading}>
        <div class="slds-align_absolute-center slds-p-around_medium">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-scrollable_x">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate" title="Name">Name</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Date">Date</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Assigned to">Assigned to</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Assigned to">Status</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate slds-text-align_center" title="Completed">Completed</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={tasks} for:item="t">
                        <tr key={t.Id}
                            data-id={t.Id}
                            class={t.rowClass}
                            onclick={handleSelectedRow}>
                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.Subject}>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                        <lightning-helptext content={t.Plan_Item__r.Instructions__c}></lightning-helptext>

                                        <span class="slds-truncate slds-m-left_x-small">
                                            {t.Subject}
                                        </span>
                                    </div>
                                </div>
                            </td>

                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.ActivityDate}>
                                    <lightning-formatted-date-time
                                        value={t.ActivityDate}
                                        year="numeric"
                                        month="2-digit"
                                        day="2-digit">
                                    </lightning-formatted-date-time>
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.Owner.Name}>
                                    {t.Owner.Name}
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate slds-text-title_bold" title={t.Status}>
                                    {t.Status}
                                </div>
                            </td>
                            <td>
                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center">
                                    <lightning-button-icon
                                        data-id={t.Id}
                                        icon-name={t.iconName}
                                        variant="border-filled"
                                        size="small"
                                        alternative-text={t.checkboxLabel}
                                        disabled={t.disabled}
                                        onclick={handleStatusClick}>
                                    </lightning-button-icon>
                                    <!--<lightning-input
                                        type="checkbox"
                                        data-id={t.Id}
                                        checked={t.Completed}
                                        onchange={handleCheckCompleted}
                                        onclick={handleCheckboxClick}
                                        label={t.checkboxLabel}
                                        variant="label-hidden">
                                    </lightning-input>

                                    <span class="slds-truncate slds-text-title_bold slds-m-left_x-small">
                                        {t.checkboxLabel}
                                    </span>-->
                                </div>
                            </td>

                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <template lwc:if={openModal}>
            <c-task-details-modal
                task={selectedTask}
                onclose={handleCloseModal}
                onsaved={handleTaskSaved}>
            </c-task-details-modal>
        </template>

    </template>
    
</template>
